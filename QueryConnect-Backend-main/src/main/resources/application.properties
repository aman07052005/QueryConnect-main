spring.application.name=Product Community Backend

# ==================== MYSQL DATABASE CONFIGURATION ====================
# URL: jdbc:mysql://host:port/database
# Default: localhost:3306/product_community_db
# Set DB_URL environment variable to override
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/product_community_db}

# MySQL Username (default: root)
# Set DB_USERNAME environment variable to override
spring.datasource.username=${DB_USERNAME:root}

# MySQL Password - Leave blank if no password is set
# Set DB_PASSWORD environment variable with your MySQL root password
# Example: set DB_PASSWORD=your_password (Windows) or export DB_PASSWORD=your_password (Linux/Mac)
spring.datasource.password=${DB_PASSWORD:Root@123}

# JDBC Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# ==================== JPA / HIBERNATE CONFIGURATION ====================
# DDL Auto Options: create | create-drop | update | validate | none
# 'update': auto-creates/updates tables on startup (good for development)
# 'validate': only validates schema without changes (good for production)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Show generated SQL in logs
spring.jpa.show-sql=${SHOW_SQL:false}

# Hibernate Dialect for MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Additional Hibernate Properties
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ==================== SERVER CONFIGURATION ====================
# Server Port (default: 8081)
server.port=${SERVER_PORT:8081}

# ==================== JWT CONFIGURATION ====================
# JWT Secret Key for token signing - MUST be set in production
# Set JWT_SECRET environment variable for custom secret
jwt.secret=${JWT_SECRET:your_secret_key_change_in_production}

# JWT Token Expiration Time in milliseconds (default: 24 hours = 86400000ms)
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==================== CORS CONFIGURATION ====================
# Allowed Origins for Cross-Origin Requests (frontend URL)
# Default: http://localhost:4200 (Angular frontend)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ==================== MONGODB CONFIGURATION ====================
# MongoDB Connection URI (if using MongoDB for some collections)
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/queryconnect}
spring.data.mongodb.database=queryconnect